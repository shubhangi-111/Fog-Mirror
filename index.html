<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fog Mirror</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="room">


        <section class="mirror-frame">


            <div class="mirror">


                <!-- LIVE CAMERA REFLECTION -->

                <video
                    id="cameraFeed"
                    autoplay
                    playsinline
                ></video>


                <!-- SMART MIRROR UI -->

                <div class="mirror-ui">


                    <div class="top-section">


                        <div class="time-section">

                            <p class="greeting">
                                GOOD EVENING
                            </p>


                            <h1 id="time">
                                10:51 PM
                            </h1>


                            <p id="date">
                                Thursday, October 8
                            </p>

                        </div>


                        <div class="status-indicator"></div>


                    </div>


                    <div class="information-grid">


                        <div class="info-card">

                            <span class="label">
                                WEATHER
                            </span>

                            <strong>
                                24°C
                            </strong>

                        </div>


                        <div class="info-card">

                            <span class="label">
                                HUMIDITY
                            </span>

                            <strong>
                                62%
                            </strong>

                        </div>


                        <div class="info-card">

                            <span class="label">
                                NEXT
                            </span>

                            <strong>
                                9:30 PM
                            </strong>

                        </div>


                    </div>


                </div>


                <!-- SUBTLE MIRROR REFLECTION -->

                <div class="reflection"></div>


                <!-- FOG CANVAS -->

                <canvas
                    id="fogCanvas"
                ></canvas>


            </div>


            <span class="mirror-label">
                SMART MIRROR PROTOTYPE
            </span>


        </section>


        <!-- CONTROLS -->

        <div class="controls">


            <button id="fogButton">
                Fog Mirror
            </button>


            <div
                class="gesture-status"
                id="gestureStatus"
            >
                WIPE TO CLEAR
            </div>


        </div>


    </main>


    <!-- MEDIAPIPE -->

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


    <!-- OUR JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
